# DomusApp · CI: typecheck/build de cada app y arranque completo con docker compose
name: CI

on:
  push:
    branches: [dev, qa, main]
  pull_request:
    branches: [dev, qa, main]

jobs:
  apps:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            run: npm run build
          - app: admin
            run: npm run build && npm run build:server
          - app: mobile
            run: npm run typecheck
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: ${{ matrix.run }}

  stack:
    name: docker compose (smoke)
    runs-on: ubuntu-latest
    needs: apps
    steps:
      - uses: actions/checkout@v4
      - name: .env de CI
        run: |
          cp .env.example .env
          sed -i "s/^JWT_ACCESS_SECRET=.*/JWT_ACCESS_SECRET=$(openssl rand -hex 32)/" .env
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose up -d --build --wait db api admin mailpit
      - run: sh scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color
