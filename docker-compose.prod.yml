# =====================================================================
#  DomusApp · override de PUBLICACIÓN (qa y prod, servidor con IP pública)
#
#    docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build
#    (lo hace scripts/deploy/deploy.sh)
#
#  Un servidor por ambiente: el de qa sigue la rama `qa` y el de producción la rama `main`.
#  Qué cambia respecto al de desarrollo:
#   · Caddy delante: HTTPS automático (Let's Encrypt) en 80/443. Es lo único publicado.
#   · El panel ya no publica su puerto: solo lo alcanza Caddy por la red interna. La app móvil
#     entra por el mismo dominio (https://<dominio>/api).
#   · Mailpit no se levanta (perfil dev): el correo sale por el proveedor SMTP real.
#   · La API confía en 2 proxies (Caddy + panel) para ver la IP real del cliente.
#   · La API se niega a arrancar con valores de desarrollo (ver deploymentProblems en src/config.ts).
# =====================================================================

services:
  caddy:
    restart: unless-stopped
    image: caddy:2.10-alpine
    container_name: domus-caddy
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"          # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados: NO borrar (Let's Encrypt limita las emisiones)
      - caddy_config:/config
    depends_on:
      admin: { condition: service_healthy }
    networks: [red_app]

  admin:
    ports: !reset []
    environment:
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}

  api:
    environment:
      TRUST_PROXY: 2

  mailpit:
    profiles: ["dev"]

volumes:
  caddy_data:
  caddy_config:
